name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Reference model runs
        run: python src/gavel_race_v2.py --races 500 > /dev/null
      - name: v1 still runs (frozen history)
        run: python src/gavel_race.py > /dev/null
      - name: Fixtures are current
        run: |
          python tests/make_fixtures.py
          git diff --exit-code tests/fixtures/
      - name: Policy guards
        run: bash scripts/policy_guard.sh
